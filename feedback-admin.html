<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070b" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Roadex Feedback Desk</title>
    <link rel="icon" type="image/png" href="assets/roadex-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="feedback.css" />
    <script src="feedback-admin.js" defer></script>
  </head>
  <body class="feedback-body admin-body">
    <main class="feedback-shell admin-shell">
      <header class="feedback-header"><a class="wordmark" href="/" aria-label="Roadex home"><img class="wordmark-logo" src="assets/roadex-logo.png" alt="" width="40" height="40" /><span>Roadex</span></a><span class="feedback-chip"><i></i>Feedback desk</span></header>
      <section class="feedback-hero admin-hero"><p class="eyebrow"><span></span>Private workspace</p><h1>Listen. Reply. <em>Build better.</em></h1><p>Review tester feedback and answer directly inside each private thread.</p></section>
      <section class="feedback-panel admin-login" data-admin-login>
        <form class="lookup-form" data-admin-key-form><label><span>Feedback admin key</span><input name="key" type="password" required autocomplete="current-password" placeholder="Enter the private admin key" /></label><button class="feedback-submit" type="submit"><span>Open feedback desk</span><b>→</b></button><p class="form-status" data-admin-status aria-live="polite"></p></form>
      </section>
      <section data-admin-desk hidden>
        <div class="desk-toolbar"><div><p class="eyebrow"><span></span>Tester inbox</p><h2>Feedback threads</h2></div><div><button class="text-button" type="button" data-refresh>Refresh</button><button class="text-button" type="button" data-lock>Lock desk</button></div></div>
        <p class="form-status" data-desk-status aria-live="polite"></p><div class="admin-thread-list" data-admin-thread-list></div>
      </section>
      <footer class="feedback-footer"><a href="/feedback">Open public form ↗</a><span>Admin key stays in this browser tab only</span></footer>
    </main>
  </body>
</html>
